name: smtp-test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Try Gmail SMTP (465 SSL, then 587 STARTTLS)
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          python3 - <<'PY'
          import os, smtplib, ssl
          from email.message import EmailMessage
          u, p, to = os.environ["SMTP_USER"], os.environ["SMTP_PASSWORD"], os.environ["MAIL_TO"]
          print("user_len", len(u), "| pw_len", len(p), "| to_len", len(to))
          print("user_has_whitespace", u != u.strip() or " " in u, "| pw_has_whitespace", p != p.strip() or " " in p)
          ok = False
          for port, mode in ((465, "ssl"), (587, "starttls")):
              try:
                  ctx = ssl.create_default_context()
                  s = (smtplib.SMTP_SSL("smtp.gmail.com", port, context=ctx, timeout=30) if mode == "ssl"
                       else smtplib.SMTP("smtp.gmail.com", port, timeout=30))
                  print(mode, "connected")
                  if mode == "starttls":
                      s.starttls(context=ctx)
                  s.ehlo()
                  s.login(u, p)
                  print(mode, "login OK")
                  m = EmailMessage()
                  m["Subject"], m["From"], m["To"] = "[시험] GitHub Actions SMTP 테스트", u, to
                  m.set_content("GitHub Actions에서 Gmail SMTP로 보낸 시험 메일입니다.")
                  s.send_message(m)
                  print(mode, "SENT OK")
                  s.quit()
                  ok = True
                  break
              except Exception as e:
                  print(mode, "FAIL", type(e).__name__, getattr(e, "smtp_code", None), str(getattr(e, "smtp_error", e))[:200])
          raise SystemExit(0 if ok else 1)
          PY
