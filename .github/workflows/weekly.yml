name: mcee-waste-weekly

on:
  schedule:
    - cron: "0 0 * * 1"   # 매주 월요일 00:00 UTC = 09:00 KST
  workflow_dispatch:       # Actions 탭에서 수동 실행

permissions:
  contents: write          # seen.json / last_run.json 갱신 커밋용

concurrency:
  group: mcee-waste-weekly
  cancel-in-progress: false

# 메일(Gmail SMTP)은 GitHub 서버에서 연결이 끊겨 사용하지 않는다.
# 수집 -> 구글 드라이브 저장까지 성공했을 때만 상태 파일을 커밋한다(실패하면 다음 실행이 같은 기간을 다시 조회).
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect
        run: python mcee_waste_weekly.py

      - name: Upload to Google Drive
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.GDRIVE_RCLONE_TOKEN }}
        run: |
          if [ -z "$RCLONE_CONFIG_GDRIVE_TOKEN" ]; then
            echo "::error::시크릿 GDRIVE_RCLONE_TOKEN 이(가) 비어 있습니다. Settings > Secrets and variables > Actions 에서 설정하세요."
            exit 1
          fi
          dir=$(ls -d output/20*/ 2>/dev/null | sort | tail -n 1)
          if [ -z "$dir" ]; then
            echo "::error::업로드할 결과 폴더(output/날짜)가 없습니다."
            exit 1
          fi
          name=$(basename "$dir")
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
          rclone copy "$dir" "gdrive:기후부주간동향/$name" --transfers 4 -v
          local_n=$(find "$dir" -type f | wc -l)
          remote_n=$(rclone lsf "gdrive:기후부주간동향/$name" -R --files-only | wc -l)
          echo "local=$local_n remote=$remote_n"
          if [ "$remote_n" -lt "$local_n" ]; then
            echo "::error::드라이브에 올라간 파일 수($remote_n)가 로컬($local_n)보다 적습니다."
            exit 1
          fi
          echo "::notice::드라이브 저장 완료: 기후부주간동향/$name ($remote_n개 파일)"

      - name: Save state (seen.json, last_run.json)
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add output/seen.json output/last_run.json
          git diff --cached --quiet || git commit -m "state: $(date +%F)"
          git push

      - name: Keep Excel and attachments as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcee-waste-${{ github.run_number }}
          path: output/20*/
          retention-days: 90
          if-no-files-found: ignore
